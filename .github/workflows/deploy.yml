name: Deploy

on:
  push:
    branches:
      - production # → production 環境
      - 'release/**' # → staging 環境
      - 'hotfix/**' # → staging 環境
      - 'feat/**' # → develop 環境
      - 'fix/**' # → develop 環境
      - 'refactor/**' # → develop 環境
      - 'test/**' # → develop 環境

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # チェック（常に実行）
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Type Check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Format Check
        run: yarn format:check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  # デプロイ（FIREBASE_SERVICE_ACCOUNT または FIREBASE_TOKEN が設定されている場合のみ）
  deploy:
    runs-on: ubuntu-latest
    needs: check
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      # ブランチからデプロイ先の環境を決定し、シークレットの有無を判定
      - name: Set environment
        id: env
        run: |
          # name: .env.<環境名> や deploy.sh に渡す環境名（小文字）
          # env_secret: .env の中身を保持するシークレット名（大文字）
          REF="${{ github.ref_name }}"
          if [ "$REF" = "production" ]; then
            echo "name=production" >> $GITHUB_OUTPUT
            echo "env_secret=ENV_PRODUCTION" >> $GITHUB_OUTPUT
          elif [[ "$REF" == release/* ]] || [[ "$REF" == hotfix/* ]]; then
            echo "name=staging" >> $GITHUB_OUTPUT
            echo "env_secret=ENV_STAGING" >> $GITHUB_OUTPUT
          else
            echo "name=develop" >> $GITHUB_OUTPUT
            echo "env_secret=ENV_DEVELOP" >> $GITHUB_OUTPUT
          fi

          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "auth=service-account" >> $GITHUB_OUTPUT
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "auth=token" >> $GITHUB_OUTPUT
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "FIREBASE_SERVICE_ACCOUNT / FIREBASE_TOKEN が未設定のためデプロイをスキップします"
          fi

      - uses: actions/checkout@v4
        if: steps.env.outputs.deploy == 'true'

      - uses: actions/setup-node@v4
        if: steps.env.outputs.deploy == 'true'
        with:
          node-version: 20
          cache: 'yarn'

      - run: yarn install --frozen-lockfile
        if: steps.env.outputs.deploy == 'true'

      # 環境別の .env をシークレットから生成
      # シークレット名: ENV_DEVELOP / ENV_STAGING / ENV_PRODUCTION
      - name: Create .env.${{ steps.env.outputs.name }}
        if: steps.env.outputs.deploy == 'true'
        env:
          ENV_FILE: ${{ secrets[steps.env.outputs.env_secret] }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "[error] シークレット ${{ steps.env.outputs.env_secret }} が未設定です"
            exit 1
          fi

          printf '%s\n' "$ENV_FILE" > .env.${{ steps.env.outputs.name }}

      # サービスアカウントで認証（推奨）
      - name: Authenticate with Service Account
        if: steps.env.outputs.deploy == 'true' && steps.env.outputs.auth == 'service-account'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> $GITHUB_ENV

      # FIREBASE_TOKEN で認証（レガシー、サービスアカウント移行まで）
      - name: Authenticate with Token (legacy)
        if: steps.env.outputs.deploy == 'true' && steps.env.outputs.auth == 'token'
        run: echo "FIREBASE_TOKEN=$FIREBASE_TOKEN" >> $GITHUB_ENV

      - name: Install Firebase CLI
        if: steps.env.outputs.deploy == 'true'
        run: npm install -g firebase-tools

      # ローカルと同じ deploy.sh を使う
      - name: Deploy to Firebase
        if: steps.env.outputs.deploy == 'true'
        run: bash scripts/deploy.sh ${{ steps.env.outputs.name }}
